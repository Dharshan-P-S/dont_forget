
name: Build DontForget iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail

          cd build/ios/iphoneos

          if [ ! -d "Runner.app" ]; then
            echo "Runner.app not found. Build failed."
            exit 1
          fi

          mkdir -p Payload
          cp -R Runner.app Payload/

          zip -qry DontForget-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DontForget-unsigned-IPA
          path: build/ios/iphoneos/DontForget-unsigned.ipa
          retention-days: 7
