name: Build iOS IPA for ESign

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        continue-on-error: true 
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          # 1. Search the entire project for the Runner.app folder
          APP_PATH=$(find . -name "Runner.app" -type d | head -n 1)
          
          # 2. Check if we actually found it
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app was not found anywhere. The Xcode build failed completely."
            exit 1
          fi
          
          echo "Successfully found the app at: $APP_PATH"
          
          # 3. Create the Payload folder in the root directory
          mkdir Payload
          
          # 4. Copy the app into the Payload folder
          cp -r "$APP_PATH" Payload/
          
          # 5. Zip it into an IPA
          zip -qq -r DontForget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontForget-IPA
          path: DontForget.ipa
          retention-days: 3