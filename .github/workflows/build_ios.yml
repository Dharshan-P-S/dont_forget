name: Build iOS IPA for ESign

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        # The "|| true" tells GitHub to ignore Flutter's certificate warning at the end
        run: flutter build ios --release --no-codesign || true

      - name: Package into IPA
        run: |
          cd build/ios/iphoneos
          
          # Safety check: Make sure the app actually exists before zipping
          if [ ! -d "Runner.app" ]; then
            echo "Runner.app was not found! The Xcode build actually failed."
            exit 1
          fi
          
          mkdir Payload
          mv Runner.app Payload/
          zip -qq -r DontForget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontForget-IPA
          path: build/ios/iphoneos/DontForget.ipa
          retention-days: 3