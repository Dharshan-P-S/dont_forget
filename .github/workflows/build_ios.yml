name: Build iOS IPA for ESign

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Flutter Assets
        # This generates the App.framework and flutter_assets needed for iOS
        continue-on-error: true 
        run: flutter build ios --release --no-codesign

      - name: Sanitize Build Environment
        # CRITICAL: Delete the messy Xcode cache created by Flutter before we run native Xcode
        run: |
          rm -rf build/ios
          rm -rf ios/Pods
          cd ios
          pod install

      - name: Compile Native iOS Binary
        # Run Apple's native compiler on a perfectly clean slate
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package into IPA
        run: |
          # 1. Xcode outputs to DerivedData by default when run natively without an archive path
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app was not found. Xcode build failed."
            exit 1
          fi
          
          echo "Packaging app from: $APP_PATH"
          
          # 2. Create the Payload folder
          mkdir Payload
          
          # 3. Copy the completed app, preserving Apple's file structures (-Rp)
          cp -Rp "$APP_PATH" Payload/
          
          # 4. Zip it into an IPA, preserving internal framework shortcuts (-y)
          zip -qq -r -y DontForget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontForget-IPA
          path: DontForget.ipa
          retention-days: 3