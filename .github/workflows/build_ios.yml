name: Build iOS IPA for ESign

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        continue-on-error: true 
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          # 1. Search specifically for the physical device Release build
          APP_PATH=$(find build/ios -name "Runner.app" | grep "iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Physical device Runner.app was not found. The Xcode build failed completely."
            exit 1
          fi
          
          echo "Successfully found the app at: $APP_PATH"
          
          # 2. Create the Payload folder
          mkdir Payload
          
          # 3. Copy the app while preserving ALL original Apple permissions and symlinks (-Rp)
          cp -Rp "$APP_PATH" Payload/
          
          # 4. CRITICAL ESIGN FIX: Delete Xcode's dummy signature folder
          rm -rf Payload/Runner.app/_CodeSignature
          
          # 5. CRITICAL ESIGN FIX: Force iOS to recognize the main file as a runnable executable
          chmod +x Payload/Runner.app/Runner
          
          # 6. Zip it into an IPA while preserving symlinks (-y is CRITICAL for iOS frameworks)
          zip -qq -r -y DontForget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontForget-IPA
          path: DontForget.ipa
          retention-days: 3