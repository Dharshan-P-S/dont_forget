name: Build iOS IPA for ESign

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Flutter Assets
        # We let Flutter bundle the UI and assets. It will crash at the end, but we ignore it.
        continue-on-error: true 
        run: flutter build ios --release --no-codesign

      - name: Compile Native iOS Binary
        # We use Apple's native Xcode tool directly, forcing it to finish the binary without a signature.
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package into IPA
        run: |
          # 1. Search for the fully completed app folder
          APP_PATH=$(find . -name "Runner.app" | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app was not found. Xcode build failed."
            exit 1
          fi
          
          echo "Packaging app from: $APP_PATH"
          
          # 2. Create the Payload folder
          mkdir Payload
          
          # 3. Copy the completed app, preserving Apple's file structures (-Rp)
          cp -Rp "$APP_PATH" Payload/
          
          # 4. Zip it into an IPA, preserving internal framework shortcuts (-y)
          zip -qq -r -y DontForget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontForget-IPA
          path: DontForget.ipa
          retention-days: 3