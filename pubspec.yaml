name: dont_forget
description: Some things are too important to forget.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & Routing
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  # UI & Calendar
  table_calendar: ^3.0.9
  intl: ^0.18.1
  google_fonts: ^6.1.0
  # Database (Phase 4)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  # Native Integration
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/